<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — snow®</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --muted: #9a9a9a;
    --line: #e4e4e4;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Helvetica Neue', Helvetica, Arial, -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .container {
    position: relative;
    min-height: 100vh;
    padding: 28px 56px 80px;
    display: flex;
    flex-direction: column;
  }

  /* ===== Top Nav ===== */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    width: 100%;
    z-index: 10;
  }
  .nav a {
    color: var(--fg);
    text-decoration: none;
    transition: opacity .25s ease;
  }
  .nav a:hover { opacity: .45; }
  .nav .active {
    position: relative;
  }
  .nav .active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    height: 1px;
    background: var(--fg);
  }

  /* ===== Logo / Home link ===== */
  .logo {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--fg);
    text-decoration: none;
    line-height: 1;
    transition: opacity .25s ease;
  }
  .logo:hover { opacity: .5; }
  .logo sup {
    font-size: 0.45em;
    vertical-align: super;
    margin-left: 1px;
    font-weight: 400;
  }

  /* ===== Main content ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 40px;
    position: relative;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .headline {
    font-size: clamp(48px, 7vw, 96px);
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 0.95;
    margin-bottom: 64px;
    text-align: center;
  }
  .headline sup {
    font-size: 0.25em;
    vertical-align: super;
    margin-left: 4px;
    letter-spacing: 0;
  }

  /* ===== Form ===== */
  .form {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .field label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .field input,
  .field textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 6px 0 10px;
    font-size: 17px;
    color: var(--fg);
    font-family: inherit;
    letter-spacing: -0.005em;
    transition: border-color .35s ease;
    resize: none;
  }
  .field textarea { min-height: 110px; line-height: 1.5; }
  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-bottom-color: var(--fg);
  }
  .field input::placeholder,
  .field textarea::placeholder {
    color: #cdcdcd;
  }

  .submit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .submit {
    background: transparent;
    border: 1px solid var(--fg);
    color: var(--fg);
    padding: 14px 36px;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: background .3s ease, color .3s ease;
  }
  .submit:hover { background: var(--fg); color: var(--bg); }

  .submit-hint {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* ===== Socials ===== */
  .socials {
    margin-top: 96px;
    display: flex;
    gap: 64px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
  }
  .socials a {
    color: var(--fg);
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: transform .35s ease, opacity .35s ease;
  }
  .socials a:hover {
    transform: translateY(-4px);
    opacity: .55;
  }
  .socials .icon {
    width: 32px;
    height: 32px;
    display: block;
  }
  .socials .label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ===== Divider line above socials ===== */
  .socials-wrap {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .socials-rule {
    width: 56px;
    height: 1px;
    background: var(--fg);
    margin-top: 80px;
  }

  @media (max-width: 720px) {
    .container { padding: 24px 28px 80px; }
    .socials { gap: 36px; }
    .submit-row { flex-direction: column; gap: 16px; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Top Nav -->
  <nav class="nav">
    <a href="index.html" class="logo" aria-label="Back to home">snow<sup>®</sup></a>
    <div style="display:flex; gap:48px; align-items:center;">
      <a href="index.html">Bio</a>
      <a href="award.html">Award</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <!-- Main -->
  <main class="main">
    <div class="eyebrow">Get in touch</div>
    <h1 class="headline">Let's make<br>something.</h1>

    <form class="form" id="contactForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="What is this about?" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell me a story..." required></textarea>
      </div>

      <div class="submit-row">
        <button type="submit" class="submit">Send message →</button>
        <span class="submit-hint">Or reach out below</span>
      </div>
    </form>

    <!-- Socials -->
    <div class="socials-wrap">
      <div class="socials-rule"></div>
      <div class="socials">

        <!-- Email -->
        <a href="mailto:your.email@example.com" aria-label="Email">
          <svg class="icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="7" width="26" height="18" rx="1"/>
            <path d="M3 9l13 9 13-9"/>
          </svg>
          <span class="label">Email</span>
        </a>

        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/your-handle" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg class="icon" viewBox="0 0 32 32" fill="currentColor">
            <path d="M27 3H5a2 2 0 0 0-2 2v22a2 2 0 0 0 2 2h22a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM10.5 25H6.75V12.5h3.75V25zM8.625 10.875A2.187 2.187 0 1 1 8.626 6.5a2.187 2.187 0 0 1 0 4.375zM25.5 25h-3.75v-6.625c0-1.75-.625-2.625-1.875-2.625-1.375 0-2.125 1-2.125 2.625V25h-3.75V12.5h3.625v1.625C18.25 13 19.5 12.125 21.5 12.125c2.25 0 4 1.375 4 4.625V25z"/>
          </svg>
          <span class="label">LinkedIn</span>
        </a>

        <!-- GitHub -->
        <a href="https://github.com/your-handle" target="_blank" rel="noopener" aria-label="GitHub">
          <svg class="icon" viewBox="0 0 32 32" fill="currentColor">
            <path d="M16 2C8.27 2 2 8.27 2 16c0 6.18 4.01 11.42 9.57 13.27.7.13.96-.3.96-.67 0-.33-.01-1.2-.02-2.36-3.9.85-4.72-1.88-4.72-1.88-.64-1.62-1.56-2.05-1.56-2.05-1.27-.87.1-.85.1-.85 1.4.1 2.14 1.44 2.14 1.44 1.25 2.14 3.28 1.52 4.08 1.16.13-.9.49-1.52.89-1.87-3.11-.35-6.39-1.56-6.39-6.93 0-1.53.55-2.78 1.44-3.76-.14-.35-.62-1.78.14-3.7 0 0 1.18-.38 3.85 1.43 1.12-.31 2.32-.47 3.51-.47 1.19 0 2.39.16 3.51.47 2.67-1.81 3.85-1.43 3.85-1.43.76 1.92.28 3.35.14 3.7.9.98 1.44 2.23 1.44 3.76 0 5.38-3.28 6.57-6.41 6.91.5.43.95 1.29.95 2.6 0 1.88-.02 3.39-.02 3.85 0 .37.25.81.97.67C25.99 27.41 30 22.18 30 16c0-7.73-6.27-14-14-14z"/>
          </svg>
          <span class="label">GitHub</span>
        </a>

        <!-- Instagram -->
        <a href="https://instagram.com/your-handle" target="_blank" rel="noopener" aria-label="Instagram">
          <svg class="icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="3.5" y="3.5" width="25" height="25" rx="6.5"/>
            <circle cx="16" cy="16" r="5.5"/>
            <circle cx="23" cy="9" r="1.25" fill="currentColor" stroke="none"/>
          </svg>
          <span class="label">Instagram</span>
        </a>

      </div>
    </div>
  </main>
</div>

<script>
  // Submit -> open mail client with pre-filled subject + body
  document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    const name = encodeURIComponent(document.getElementById('name').value);
    const subject = encodeURIComponent(document.getElementById('subject').value);
    const message = encodeURIComponent(
      'From: ' + decodeURIComponent(name) + '\n\n' + document.getElementById('message').value
    );
    // ↓↓↓ 把这里换成你的邮箱
    window.location.href = `mailto:your.email@example.com?subject=${subject}&body=${message}`;
  });
</script>
</body>
</html>
